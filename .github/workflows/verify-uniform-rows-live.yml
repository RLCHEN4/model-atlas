name: Verify published uniform ranking rows
on:
  push:
    branches: [fix/uniform-64px-rows]
    paths: [.github/workflows/verify-uniform-rows-live.yml]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published homepage equals the approved HTML
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, re, time
          from urllib.request import Request, urlopen
          expected = 'cb4b13f08c966fe36ffb1ac636e14ef21b3dd1da3856f7869f2c10930e8d4ca3'
          url = 'https://rlchen4.github.io/model-atlas/'
          last = None
          for attempt in range(12):
              try:
                  request = Request(url + '?verify=uniform-864fe24-' + str(attempt), headers={'Cache-Control':'no-cache','User-Agent':'MODEL-ATLAS-release-verification/1.0'})
                  with urlopen(request, timeout=10) as response:
                      body = response.read()
                      digest = hashlib.sha256(body).hexdigest()
                      last = {'url':url,'http_status':response.status,'bytes':len(body),'sha256':digest,'matches_approved':digest==expected}
                  print(json.dumps(last), flush=True)
                  if digest == expected:
                      text = body.decode('utf-8')
                      assert 'id="uniform-ranking-row-layout"' in text
                      assert '.ranking-table tbody > tr[data-model-id]{height:64px}' in text
                      snapshot = json.loads(re.search(r'const benchmark=(.*?);\n', text).group(1))
                      values = snapshot['measurements']
                      assert [values[e]['score'] for e in ['max','xhigh','high','medium','low']] == [58,56,54,51,42]
                      assert [values[e]['cost_usd'] for e in ['max','xhigh','high','medium','low']] == [5.98,3.46,1.82,1.34,0.55]
                      assert 'icon-glyph' in text and 'hero-chart' in text and 'compareDialog' in text
                      print('PASS: published homepage matches approved HTML exactly; uniform 64px row CSS present; Opus scores/costs and original design preserved.')
                      break
              except Exception as error:
                  last = str(error)
                  print('Attempt', attempt + 1, last, flush=True)
              if attempt < 11:
                  time.sleep(6)
          else:
              raise SystemExit('Live verification failed: ' + str(last))
          PY
