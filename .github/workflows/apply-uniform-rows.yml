name: Apply approved uniform ranking rows
on:
  push:
    branches: [fix/uniform-64px-rows]
    paths: [.github/workflows/apply-uniform-rows.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate the exact approved HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess
          p = Path('index.html')
          raw = p.read_bytes()
          assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest() == '1750ed503e3505c0bb3601322bbab3218f4be70a', 'Homepage changed; refusing overwrite'
          text = raw.decode('utf-8')
          css = '''
          <style id="uniform-ranking-row-layout">
          /* Layout-only fix. All model records, scores, costs and source notes stay unchanged. */
          .ranking-table tbody > tr[data-model-id]{height:64px}
          .ranking-table tbody > tr[data-model-id] > td{height:64px;padding:8px 13px;vertical-align:middle}
          .ranking-table tbody > tr[data-model-id] .model-cell{min-width:0;align-items:center}
          .ranking-table tbody > tr[data-model-id] .model-cell > div{min-width:0;max-height:44px;overflow:hidden}
          .ranking-table tbody > tr[data-model-id] .model-name{display:block;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .ranking-table tbody > tr[data-model-id] .model-badge{max-width:100%;line-height:14px;margin-top:2px;padding:2px 5px;vertical-align:top;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          /* Extended provenance and API rates remain accessible in the comparison dialog and Opus cards. */
          .ranking-table tbody > tr[data-model-id] .model-api-note{display:none}
          .ranking-table tbody > tr[data-model-id] > .best-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .ranking-table tbody > tr[data-model-id] .compare-checkbox{display:block;margin:0 auto}
          @media print{
            .ranking-table tbody > tr[data-model-id],.ranking-table tbody > tr[data-model-id] > td{height:52px}
            .ranking-table tbody > tr[data-model-id] > td{padding:5px}
          }
          </style>
          '''
          updated = text.replace('</head>', css + '</head>', 1)
          result = updated.encode('utf-8')
          expected = 'cb4b13f08c966fe36ffb1ac636e14ef21b3dd1da3856f7869f2c10930e8d4ca3'
          assert hashlib.sha256(result).hexdigest() == expected, 'Output does not match user-approved HTML'
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, re.S)
          assert scripts == re.findall(r'<script[^>]*>(.*?)</script>', updated, re.S), 'Scripts and all data must stay unchanged'
          for i, code in enumerate(scripts):
              file = Path('/tmp') / f'uniform-row-check-{i}.js'
              file.write_text(code, encoding='utf-8')
              subprocess.run(['node','--check',str(file)], check=True)
          p.write_bytes(result)
          print('PASS: exact approved HTML; CSS-only; model data and scripts unchanged.')
          print('SHA256:', expected)
          PY
      - name: Commit approved homepage and remove one-time helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-uniform-rows.yml
          git add index.html
          git commit -m 'style: unify GPT and Opus ranking rows at 64px; preserve scores and costs'
          git push origin HEAD:fix/uniform-64px-rows
