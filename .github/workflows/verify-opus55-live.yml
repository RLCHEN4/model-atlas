name: Verify published Opus 5.5 benchmark data
on:
  push:
    branches: [fix/opus55-benchmark-snapshot]
    paths: [.github/workflows/verify-opus55-live.yml]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify published homepage and all five benchmark configurations
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, re, time
          from urllib.request import Request, urlopen
          expected = 'e7a83ab50f445521feb1ffc1be10ab90056e611c8a405aa27585740e2953d1e9'
          url = 'https://rlchen4.github.io/model-atlas/'
          last = None
          for attempt in range(12):
              try:
                  request = Request(url + '?verify=opus55-2447be0-' + str(attempt), headers={'Cache-Control':'no-cache', 'User-Agent':'MODEL-ATLAS-release-verification/1.0'})
                  with urlopen(request, timeout=10) as response:
                      body = response.read()
                      digest = hashlib.sha256(body).hexdigest()
                      last = {'url':url,'http_status':response.status,'bytes':len(body),'sha256':digest,'matches_tested':digest==expected}
                  print(json.dumps(last), flush=True)
                  if digest == expected:
                      text = body.decode('utf-8')
                      snapshot = json.loads(re.search(r'const benchmark=(.*?);\n', text).group(1))
                      values = snapshot['measurements']
                      assert [values[e]['score'] for e in ['max','xhigh','high','medium','low']] == [58,56,54,51,42]
                      assert [values[e]['cost_usd'] for e in ['max','xhigh','high','medium','low']] == [5.98,3.46,1.82,1.34,0.55]
                      assert snapshot['configuration'] == 'Default Fallback'
                      assert snapshot['index_version'] == '4.3.2'
                      assert snapshot['captured_on'] == '2026-10-09'
                      assert 'icon-glyph' in text and 'hero-chart' in text and 'compareDialog' in text
                      print('PASS: public homepage equals tested build; five Opus 5.5 scores and task costs present; source/version/config/date attached; approved design retained.')
                      break
              except Exception as error:
                  last = str(error)
                  print('Attempt', attempt+1, last, flush=True)
              if attempt < 11:
                  time.sleep(6)
          else:
              raise SystemExit('Live verification failed: '+str(last))
          PY
