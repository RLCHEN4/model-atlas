name: Apply tested Opus 5.5 benchmark snapshot
on:
  push:
    branches: [fix/opus55-benchmark-snapshot]
    paths: [.github/workflows/apply-opus55-benchmarks.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact locally tested changes and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, json, hashlib, re, subprocess
          p = Path('index.html')
          raw = p.read_bytes()
          assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest() == 'd14b5c10558bd96668fa408b18db7c71fdd7504b', 'Homepage changed; refusing overwrite'
          text = raw.decode('utf-8')
          old_data = re.search(r'window.MODEL_ATLAS_INLINE_DATA=(.*?);</script>', text, re.S).group(1)
          # Compressed JSON edit spans; no external source scraping or API access.
          payload = ''
          ops = json.loads(zlib.decompress(base64.b64decode(payload)))
          for start, end, replacement in reversed(ops):
              text = text[:start] + replacement + text[end:]
          result = text.encode('utf-8')
          expected = 'e7a83ab50f445521feb1ffc1be10ab90056e611c8a405aa27585740e2953d1e9'
          assert hashlib.sha256(result).hexdigest() == expected, 'Output differs from 46-check locally tested build'
          assert re.search(r'window.MODEL_ATLAS_INLINE_DATA=(.*?);</script>', text, re.S).group(1) == old_data, 'GPT snapshot must be unchanged'
          for i, code in enumerate(re.findall(r'<script[^>]*>(.*?)</script>', text, re.S)):
              temp = Path('/tmp') / f'opus55-validated-{i}.js'
              temp.write_text(code, encoding='utf-8')
              subprocess.run(['node', '--check', str(temp)], check=True)
          p.write_bytes(result)
          print('PASS: approved layout preserved, five dated Default Fallback citations, GPT unchanged, exact tested bytes, JS valid.')
          print('SHA256:', expected)
          PY
      - name: Commit validated homepage and remove one-time helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-opus55-benchmarks.yml
          git add index.html
          git commit -m 'fix: populate five Opus 5.5 benchmark results with dated source citations'
          git push origin HEAD:fix/opus55-benchmark-snapshot
