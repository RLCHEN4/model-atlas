name: Apply tested Opus comparison
on:
  push:
    branches: [feature/opus-comparison]
    paths: [.github/workflows/apply-opus.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extend the approved homepage
        run: python scripts/apply_opus.py
      - name: Verify exact tested HTML and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess
          body = Path('index.html').read_bytes()
          expected = '0165c6d3f08d8f68197ba420f25d9e6b4e244c2884f0b56e41e025141c76c7be'
          assert hashlib.sha256(body).hexdigest() == expected, 'Generated HTML differs from locally tested HTML'
          text = body.decode('utf-8')
          for i, code in enumerate(re.findall(r'<script[^>]*>(.*?)</script>', text, re.S)):
              file = Path('/tmp') / f'model-atlas-opus-{i}.js'
              file.write_text(code, encoding='utf-8')
              subprocess.run(['node', '--check', str(file)], check=True)
          assert 'score:null,cost_usd:null,relative_cost:null' in text
          assert 'claude-opus-5-5' in text and 'claude-opus-5' in text
          print('PASS: exact tested HTML; null benchmark handling; JS syntax')
          PY
      - name: Commit homepage and remove one-time builder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_opus.py .github/workflows/apply-opus.yml
          git add index.html
          git commit -m 'feat: add Claude Opus comparison with verified specs and explicit missing benchmarks'
          git push origin HEAD:feature/opus-comparison
